# Test the minimum supported compilers (GCC 13 and Clang 18), the latest available GCC,
# the sanitizer build, the no-exceptions path, and formatting.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install clang-format==23.1.1
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror

  build:
    name: ${{ matrix.name }}-${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-13
            cxx: g++-13
            packages: g++-13
            build_type: Debug
          - name: gcc-13
            cxx: g++-13
            packages: g++-13
            build_type: Release
          - name: gcc-14
            cxx: g++-14
            packages: g++-14
            build_type: Release
          - name: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev g++-13
            build_type: Debug
          - name: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev g++-13
            build_type: Release
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.packages }}
      - name: Cache Catch2
        uses: actions/cache@v6
        with:
          path: .deps
          key: catch2-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: catch2-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DLAZULI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14
      - name: Cache Catch2
        uses: actions/cache@v6
        with:
          path: .deps
          key: catch2-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: catch2-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DLAZULI_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  no-exceptions:
    name: no-exceptions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-13
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS=-fno-exceptions \
            -DLAZULI_BUILD_TESTS=OFF \
            -DLAZULI_BUILD_EXAMPLES=OFF \
            -DLAZULI_BUILD_BENCH=OFF \
            -DLAZULI_WARNINGS_AS_ERRORS=ON
      - name: Build the library
        run: cmake --build build
      - name: The no-throw facade links and runs
        run: |
          cat > "$RUNNER_TEMP/nt.cpp" <<'EOF'
          #include <lazuli/lazuli.hpp>

          #include <cstdio>

          int main() {
              const lazuli::matrix<double> a{{2.0, 0.0}, {0.0, 3.0}};
              const auto factors = lazuli::nt::lu(a);
              if (!factors) {
                  return 1;
              }
              std::printf("nt::lu -> %zu x %zu\n", factors->l.rows(), factors->u.cols());
              return 0;
          }
          EOF
          g++-13 -std=c++20 -fno-exceptions -Iinclude "$RUNNER_TEMP/nt.cpp" \
            build/liblazuli.a -fopenmp -o "$RUNNER_TEMP/nt"
          "$RUNNER_TEMP/nt"
      - name: The throwing facade is rejected with a pointer to nt
        run: |
          cat > "$RUNNER_TEMP/throws.cpp" <<'EOF'
          #include <lazuli/lazuli.hpp>

          int main() {
              const lazuli::matrix<double> a(2, 2);
              (void)lazuli::lu(a);
          }
          EOF
          if g++-13 -std=c++20 -fno-exceptions -Iinclude -c "$RUNNER_TEMP/throws.cpp" \
            -o "$RUNNER_TEMP/throws.o" 2> "$RUNNER_TEMP/throws.log"; then
            echo "lazuli::lu must not compile with -fno-exceptions"
            exit 1
          fi
          grep -q "use lazuli::nt::lu instead" "$RUNNER_TEMP/throws.log"
          echo "diagnostic ok"
